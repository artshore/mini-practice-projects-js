<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>99 Bottles of Beer</title>
  </head>
  <body>
    <p></p>
    <button>Sing Song</button>
    <script>
      document.querySelector("button").addEventListener("click", singSong);
      function singSong() {
        for (let i = 99; i > 0; i--) {
          let verse =
            i +
            " bottles of beer on the wall, " +
            i +
            " bottles of beer. Take one down, pass it around. " +
            (i - 1) +
            " bottles of beer on the wall.";
          setTimeout(
            () => {
              document.querySelector("p").innerHTML = verse;
            },
            (99 - i) * 1000,
          );
        }
      }
    </script>
  </body>
</html>
